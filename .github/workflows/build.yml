name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk CrystalClock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrystalClock
          path: CrystalClock.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CrystalClock.apk \
            --title "Crystal Clock (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download CrystalClock.apk below and open it on your phone." \
            --target "$GITHUB_SHA"
